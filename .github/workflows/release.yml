name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            echo "Expected a tag such as v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi

          echo "Release version: $GITHUB_REF_NAME"

      - name: Download Go modules
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          export GOOS=linux
          export CGO_ENABLED=0

          build_one() {
            local asset="$1"
            local goarch="$2"
            local goarm="${3:-}"
            local output="unifiedproxy-linux-${asset}"
            local archive="${GITHUB_WORKSPACE}/dist/${output}.tar.gz"

            export GOARCH="$goarch"

            if [[ -n "$goarm" ]]; then
              export GOARM="$goarm"
            else
              unset GOARM || true
            fi

            echo "Building UnifiedProxy ${output}..."

            go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/${output}" \
              .

            chmod 0755 "dist/${output}"

            tar \
              -C "${GITHUB_WORKSPACE}/dist" \
              -czf "$archive" \
              "$output"

            for role in control node; do
              fleet_output="${role}-linux-${asset}"
              go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$fleet_output" "./cmd/$role"
              tar -czf "dist/$fleet_output.tar.gz" -C dist "$fleet_output" -C "$GITHUB_WORKSPACE" LICENSE NOTICE licenses/UnifiedProxy-MIT.txt scripts/install-fleet.sh
            done
          }

          build_one "386"   "386"
          build_one "amd64" "amd64"
          build_one "arm64" "arm64"
          build_one "armv5" "arm" "5"
          build_one "armv6" "arm" "6"
          build_one "armv7" "arm" "7"
          build_one "s390x" "s390x"

          echo "Building unifiedproxy-windows-amd64..."

          export GOOS=windows
          export GOARCH=amd64
          export CGO_ENABLED=0
          unset GOARM || true

          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/unifiedproxy.exe" \
            .

          (
            cd dist
            zip -9 "unifiedproxy-windows-amd64.zip" "unifiedproxy.exe"
          )

          rm "dist/unifiedproxy.exe"

          for role in control node; do
            go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${role}-windows-amd64.exe" "./cmd/$role"
            zip -j -9 "dist/${role}-windows-amd64.zip" "dist/${role}-windows-amd64.exe" LICENSE NOTICE licenses/UnifiedProxy-MIT.txt
          done
          (cd dist && find . -maxdepth 1 -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 sha256sum > sha256sums.txt)

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          assets=(
            "unifiedproxy-linux-386"
            "unifiedproxy-linux-amd64"
            "unifiedproxy-linux-arm64"
            "unifiedproxy-linux-armv5"
            "unifiedproxy-linux-armv6"
            "unifiedproxy-linux-armv7"
            "unifiedproxy-linux-s390x"
          )

          for asset in "${assets[@]}"; do
            archive="dist/${asset}.tar.gz"

            if [[ ! -s "$archive" ]]; then
              echo "Missing or empty archive: $archive"
              exit 1
            fi

            contents="$(tar -tzf "$archive")"

            if [[ "$contents" != "$asset" ]]; then
              echo "Unexpected contents in $archive:"
              echo "$contents"
              exit 1
            fi
          done

          windows_archive="dist/unifiedproxy-windows-amd64.zip"

          if [[ ! -s "$windows_archive" ]]; then
            echo "Missing or empty archive: $windows_archive"
            exit 1
          fi

          windows_contents="$(unzip -Z1 "$windows_archive")"

          if [[ "$windows_contents" != "unifiedproxy.exe" ]]; then
            echo "Unexpected contents in $windows_archive:"
            echo "$windows_contents"
            exit 1
          fi

          unzip -tq "$windows_archive"

          reported_version="$(./dist/unifiedproxy-linux-amd64 version)"

          if [[ "$reported_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Incorrect embedded version."
            echo "Expected: $GITHUB_REF_NAME"
            echo "Actual:   $reported_version"
            exit 1
          fi

          echo "Embedded version: $reported_version"
          for role in control node; do
            [[ "$(./dist/${role}-linux-amd64 version)" == "$GITHUB_REF_NAME" ]]
            for arch in 386 amd64 arm64 armv5 armv6 armv7 s390x; do
              test -s "dist/${role}-linux-${arch}"
              tar -tzf "dist/${role}-linux-${arch}.tar.gz" | grep -Fx "${role}-linux-${arch}"
            done
            unzip -tq "dist/${role}-windows-amd64.zip"
          done
          (cd dist && sha256sum --check sha256sums.txt)
          echo
          sha256sum dist/*.tar.gz dist/*.zip

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_files=(
            dist/*.tar.gz
            dist/*.zip
            dist/*-windows-amd64.exe
            dist/sha256sums.txt
          )
          for role in control node; do
            for arch in 386 amd64 arm64 armv5 armv6 armv7 s390x; do
              release_files+=("dist/${role}-linux-${arch}")
            done
          done

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; replacing its release assets."

            gh release upload \
              "$GITHUB_REF_NAME" \
              "${release_files[@]}" \
              --clobber
          else
            release_options=(
              --verify-tag
              --generate-notes
              --title "UnifiedProxy ${GITHUB_REF_NAME}"
            )

            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_options+=(--prerelease)
            fi

            gh release create \
              "$GITHUB_REF_NAME" \
              "${release_files[@]}" \
              "${release_options[@]}"
          fi

  docker:
    name: Publish Docker image
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UNIFIEDPROXY_VERSION=${{ github.ref_name }}
            MIHOMO_VERSION=1.19.33
            MIHOMO_SHA256=386508bfb1c72c43b6a0eda73708ecdce82546581b0ebcb16366c53757c622b6
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fleet-docker:
    name: Publish fleet ${{ matrix.role }} image
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [control, node]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image repository
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.role }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fleet
          target: ${{ matrix.role }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=fleet-${{ matrix.role }}
          cache-to: type=gha,scope=fleet-${{ matrix.role }},mode=max
