name: Publish release images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Publish ${{ matrix.role }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [unifiedproxy, control, node]
    steps:
      - name: Validate release tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -Fx true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image details
        id: image
        env:
          ROLE: ${{ matrix.role }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$ROLE" == unifiedproxy ]]; then
            echo 'file=Dockerfile' >> "$GITHUB_OUTPUT"
            echo 'platforms=linux/amd64' >> "$GITHUB_OUTPUT"
            echo 'target=' >> "$GITHUB_OUTPUT"
          else
            name="$name-$ROLE"
            echo 'file=Dockerfile.fleet' >> "$GITHUB_OUTPUT"
            echo 'platforms=linux/amd64,linux/arm64' >> "$GITHUB_OUTPUT"
            echo "target=$ROLE" >> "$GITHUB_OUTPUT"
          fi
          printf 'tags<<EOF\n%s:%s\n%s:%s\n%s:latest\nEOF\n' "$name" "$VERSION" "$name" "${VERSION#v}" "$name" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.image.outputs.file }}
          target: ${{ steps.image.outputs.target }}
          platforms: ${{ steps.image.outputs.platforms }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ inputs.version }}
            UNIFIEDPROXY_VERSION=${{ inputs.version }}
          cache-from: type=gha,scope=manual-${{ matrix.role }}
          cache-to: type=gha,scope=manual-${{ matrix.role }},mode=max
