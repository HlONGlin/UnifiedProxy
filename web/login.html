<!doctype html>
<html lang="zh-CN" data-default-language="zh-CN" data-theme="light" data-color-theme="t0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>m-ui | 登录</title>
  <link rel="stylesheet" href="static/themes.css">
  <link rel="stylesheet" href="static/login.css">
  <link rel="stylesheet" href="static/components.css">
  <script src="static/appearance.js"></script>
</head>
<body>
  <div class="ambient-backdrop" aria-hidden="true">
    <div class="aurora-orb orb-1"></div>
    <div class="aurora-orb orb-2"></div>
    <div class="aurora-orb orb-3"></div>
    <div class="aurora-orb orb-4"></div>
  </div>
  <main class="login-card">
    <div class="mac-traffic-lights" aria-hidden="true">
      <span class="mac-dot red"></span>
      <span class="mac-dot yellow"></span>
      <span class="mac-dot green"></span>
    </div>
    <button class="settings-button" id="settings-button" type="button" aria-label="面板设置" aria-expanded="false">
      <svg class="sf-symbol" aria-hidden="true"><use href="#sf-setting"></use></svg>
    </button>

    <section class="settings-menu" id="settings-menu" aria-hidden="true">
      <div class="settings-title">面板设置</div>
      <div class="settings-body">
        <div class="settings-row"><label class="theme-switch"><input id="dark-mode" type="checkbox" aria-label="暗色"><span></span></label><span>暗色</span></div>

        <div data-appearance-slot></div><span class="language-label">语言</span>
        <select class="language-select" id="language-select" aria-label="语言"><option value="zh-CN">🇨🇳 简体中文</option><option value="zh-TW">🇹🇼 繁體中文</option><option value="en">🇺🇸 English</option><option value="ja">🇯🇵 日本語</option><option value="ru">🇷🇺 Русский</option><option value="fa">🇮🇷 فارسی</option><option value="vi">🇻🇳 Tiếng Việt</option><option value="es">🇪🇸 Español</option><option value="tr">🇹🇷 Türkçe</option><option value="uk">🇺🇦 Українська</option><option value="pt-BR">🇧🇷 Português</option></select>
      </div>
    </section>

    <div class="brand-emblem">
      <div class="brand-icon">
        <img src="media/m-ui_logo.png" alt="m-ui" width="64" height="64">
      </div>
    </div>

    <h1 class="headline zoom">
      <span class="words-wrapper">
        <b class="is-visible" data-word="hello">你好</b>
        <b data-word="title">欢迎</b>
      </span>
    </h1>

    <form id="login-form">
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="用户名" aria-label="用户名" required autofocus>
      </div>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="密码" aria-label="密码" required>
        <button class="password-toggle" id="password-toggle" type="button" aria-label="显示密码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle><path d="m4 4 16 16"></path></svg></button>
      </div>
      <div class="centered">
        <div class="wave-btn-bg">
          <button class="login-button" id="login-button" type="submit">登录</button>
        </div>
      </div>
      <div class="error" id="error" role="alert"></div>
    </form>
  </main><script src="static/sf-symbols.js"></script>
  <script src="static/swiftui-components.js"></script>
  <script>
    const root = document.documentElement;
    const settingsButton = document.getElementById('settings-button');
    const settingsMenu = document.getElementById('settings-menu');
    const darkMode = document.getElementById('dark-mode');
    const languageSelect = document.getElementById('language-select');
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('password-toggle');
    const loginButton = document.getElementById('login-button');
    const messages = {
      'zh-CN': { pageTitle:'m-ui | 登录', hello:'你好', title:'欢迎', username:'用户名', password:'密码', login:'登录', logging:'登录中…', settings:'面板设置', dark:'暗色', ultra:'超暗色', language:'语言', show:'显示密码', hide:'隐藏密码', failed:'登录失败', languageFailed:'语言设置保存失败' },
      'zh-TW': { pageTitle:'m-ui | 登入', hello:'你好', title:'歡迎', username:'使用者名稱', password:'密碼', login:'登入', logging:'登入中…', settings:'面板設定', dark:'深色', ultra:'極暗', language:'語言', show:'顯示密碼', hide:'隱藏密碼', failed:'登入失敗', languageFailed:'語言設定儲存失敗' },
      en: { pageTitle:'m-ui | Log In', hello:'Hello', title:'Welcome', username:'Username', password:'Password', login:'Log In', logging:'Logging in…', settings:'Panel Settings', dark:'Dark', ultra:'Ultra Dark', language:'Language', show:'Show password', hide:'Hide password', failed:'Login failed', languageFailed:'Failed to save the language setting' },
      ja: { pageTitle:'m-ui | ログイン', hello:'こんにちは', title:'ようこそ', username:'ユーザー名', password:'パスワード', login:'ログイン', logging:'ログイン中…', settings:'パネル設定', dark:'ダーク', ultra:'ウルトラダーク', language:'言語', show:'パスワードを表示', hide:'パスワードを非表示', failed:'ログイン失敗', languageFailed:'言語設定の保存に失敗しました' },
      ru: { pageTitle:'m-ui | Вход', hello:'Здравствуйте', title:'Добро пожаловать', username:'Имя пользователя', password:'Пароль', login:'Войти', logging:'Вход…', settings:'Настройки панели', dark:'Тёмная', ultra:'Очень тёмная', language:'Язык', show:'Показать пароль', hide:'Скрыть пароль', failed:'Ошибка входа', languageFailed:'Не удалось сохранить язык' },
      fa: { pageTitle:'m-ui | ورود', hello:'سلام', title:'خوش آمدید', username:'نام کاربری', password:'گذرواژه', login:'ورود', logging:'در حال ورود…', settings:'تنظیمات پنل', dark:'تیره', ultra:'تیرهٔ کامل', language:'زبان', show:'نمایش گذرواژه', hide:'پنهان کردن گذرواژه', failed:'ورود ناموفق بود', languageFailed:'ذخیره زبان ناموفق بود' },
      vi: { pageTitle:'m-ui | Đăng nhập', hello:'Xin chào', title:'Chào mừng', username:'Tên người dùng', password:'Mật khẩu', login:'Đăng nhập', logging:'Đang đăng nhập…', settings:'Cài đặt bảng điều khiển', dark:'Tối', ultra:'Tối sâu', language:'Ngôn ngữ', show:'Hiện mật khẩu', hide:'Ẩn mật khẩu', failed:'Đăng nhập thất bại', languageFailed:'Không thể lưu ngôn ngữ' },
      es: { pageTitle:'m-ui | Iniciar sesión', hello:'Hola', title:'Bienvenido', username:'Usuario', password:'Contraseña', login:'Iniciar sesión', logging:'Iniciando sesión…', settings:'Ajustes del panel', dark:'Oscuro', ultra:'Muy oscuro', language:'Idioma', show:'Mostrar contraseña', hide:'Ocultar contraseña', failed:'Error de inicio de sesión', languageFailed:'No se pudo guardar el idioma' },
      tr: { pageTitle:'m-ui | Giriş', hello:'Merhaba', title:'Hoş geldiniz', username:'Kullanıcı adı', password:'Parola', login:'Giriş yap', logging:'Giriş yapılıyor…', settings:'Panel Ayarları', dark:'Koyu', ultra:'Çok Koyu', language:'Dil', show:'Parolayı göster', hide:'Parolayı gizle', failed:'Giriş başarısız', languageFailed:'Dil ayarı kaydedilemedi' },
      uk: { pageTitle:'m-ui | Вхід', hello:'Привіт', title:'Ласкаво просимо', username:"Ім'я користувача", password:'Пароль', login:'Увійти', logging:'Вхід…', settings:'Налаштування панелі', dark:'Темна', ultra:'Дуже темна', language:'Мова', show:'Показати пароль', hide:'Приховати пароль', failed:'Помилка входу', languageFailed:'Не вдалося зберегти мову' },
      'pt-BR': { pageTitle:'m-ui | Entrar', hello:'Olá', title:'Bem-vindo', username:'Nome de Usuário', password:'Senha', login:'Entrar', logging:'Entrando…', settings:'Configurações do Painel', dark:'Escuro', ultra:'Muito Escuro', language:'Idioma', show:'Mostrar senha', hide:'Ocultar senha', failed:'Falha no login', languageFailed:'Falha ao salvar a configuração de idioma' }
    };

    /* Apple Design 三套主题（Light / Dark / Ultra Dark OLED）。Ultra Dark 只在深色模式下开启，
       切换期间打上 data-theme-animations="off" 抑制所有闪烁过渡。 */
    function applyTheme(theme) { UPTheme.setMode(theme === 'dark' || theme === true); }

    function applyLanguage(language) {
      const lang = messages[language] ? language : 'zh-CN';
      const text = messages[lang];
      root.lang = lang;
      root.dir = lang === 'fa' ? 'rtl' : 'ltr';
      document.title = text.pageTitle;
      languageSelect.value = lang;
      document.querySelectorAll('.words-wrapper b').forEach(word => { word.textContent = text[word.dataset.word]; });
      document.getElementById('username').placeholder = text.username;
      passwordInput.placeholder = text.password;
      // placeholder 和 aria-label 得一起换，否则读屏软件在英文界面下仍念中文。
      document.getElementById('username').setAttribute('aria-label', text.username);
      passwordInput.setAttribute('aria-label', text.password);
      loginButton.textContent = loginButton.disabled ? text.logging : text.login;
      document.querySelector('.settings-title').textContent = text.settings;
      document.querySelector('.settings-row > span').textContent = text.dark;
      document.querySelector('.language-label').textContent = text.language;
      settingsButton.setAttribute('aria-label', text.settings);
      darkMode.setAttribute('aria-label', text.dark);
      languageSelect.setAttribute('aria-label', text.language);
      passwordToggle.setAttribute('aria-label', passwordInput.type === 'password' ? text.show : text.hide);
      localStorage.setItem('mui-language', lang);
    }

    // SwiftUI 标题词轮播动效：每隔 2s 循环轮转问候语，触发优雅缩放微动效。
    function rotateHeadline(word, delay) {
      const next = word.nextElementSibling || word.parentElement.firstElementChild;
      word.classList.replace('is-visible', 'is-hidden');
      next.classList.remove('is-hidden');
      next.classList.add('is-visible');
      setTimeout(() => rotateHeadline(next, delay), delay);
    }
    function closeSettings() {
      settingsMenu.classList.remove('open');
      settingsMenu.setAttribute('aria-hidden', 'true');
      settingsButton.setAttribute('aria-expanded', 'false');
    }

    settingsButton.addEventListener('click', () => {
      const open = !settingsMenu.classList.contains('open');
      settingsMenu.classList.toggle('open', open);
      settingsMenu.setAttribute('aria-hidden', String(!open));
      settingsButton.setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', event => { if (!settingsMenu.contains(event.target) && !settingsButton.contains(event.target)) closeSettings(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeSettings(); });
    darkMode.addEventListener('change', () => applyTheme(darkMode.checked ? 'dark' : 'light'));
    /* 在主题控件上 mousedown 关掉过渡、mouseleave/touchend 恢复，避免整页背景渐变闪烁 */
    for (const control of [darkMode.closest('.settings-row')]) {
      control.addEventListener('mousedown', () => root.setAttribute('data-theme-animations', 'off'));
      control.addEventListener('mouseleave', () => root.removeAttribute('data-theme-animations'));
      control.addEventListener('touchend', () => root.removeAttribute('data-theme-animations'));
    }
    let languageSave = Promise.resolve();
    function persistGlobalLanguage(language) {
      const base = window.location.pathname.replace(/[^/]*$/, '');
      languageSave = languageSave.catch(() => {}).then(async () => {
        const response = await fetch(base + 'api/language', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({language}) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || (messages[language] || messages['zh-CN']).languageFailed);
      });
      return languageSave;
    }
    // The choice is kept in this browser until sign-in; /api/language needs a session,
    // so it is saved as the panel language right after a successful login.
    languageSelect.addEventListener('change', () => applyLanguage(languageSelect.value));

    passwordToggle.addEventListener('click', () => {
      const visible = passwordInput.type === 'text';
      passwordInput.type = visible ? 'password' : 'text';
      const lang = messages[languageSelect.value] || messages['zh-CN'];
      passwordToggle.setAttribute('aria-label', visible ? lang.show : lang.hide);
      passwordInput.focus();
    });

    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('error');
      const lang = messages[languageSelect.value] || messages['zh-CN'];
      error.textContent = '';
      loginButton.disabled = true;
      loginButton.textContent = lang.logging;
      const body = { username: document.getElementById('username').value.trim(), password: passwordInput.value };
      try {
        // 登录页可能被挂在自定义 URI 路径下，用相对地址请求，别写死站点根。
        const base = window.location.pathname.replace(/[^/]*$/, '');
        const response = await fetch(base + 'api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || lang.failed);
        await persistGlobalLanguage(languageSelect.value).catch(() => {});
        window.location.href = (data.data && data.data.redirect) || base;
      } catch (exception) {
        error.textContent = exception.message;
        loginButton.disabled = false;
        loginButton.textContent = lang.login;
      }
    });

    UPTheme.sync();
    // 面板设置里的 Language 通过 data-default-language 注进来，作为没访问过本面板的
    // 浏览器的初始语言；本机手动选过的话以 localStorage 为准。
    applyLanguage(localStorage.getItem('mui-language') || document.documentElement.dataset.defaultLanguage || 'zh-CN');
    setTimeout(() => rotateHeadline(document.querySelector('.words-wrapper b.is-visible'), 2000), 2000);
  </script>
</body>
</html>
