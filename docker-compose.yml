name: unifiedproxy

services:
  unifiedproxy:
    image: ghcr.io/hlonglin/unifiedproxy:${UNIFIEDPROXY_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        UNIFIEDPROXY_VERSION: ${UNIFIEDPROXY_BUILD_VERSION:-dev}
        MIHOMO_VERSION: ${MIHOMO_VERSION:-1.19.33}
        MIHOMO_SHA256: ${MIHOMO_SHA256:-386508bfb1c72c43b6a0eda73708ecdce82546581b0ebcb16366c53757c622b6}
    platform: linux/amd64
    container_name: unifiedproxy
    restart: unless-stopped
    stop_grace_period: 10s

    # Host networking lets every inbound configured in the panel listen on its
    # selected port without recreating the container for each new port.
    network_mode: host

    environment:
      TZ: ${TZ:-UTC}
      UNIFIEDPROXY_LISTEN_IP: 0.0.0.0
      UNIFIEDPROXY_PANEL_PORT: ${UNIFIEDPROXY_PANEL_PORT:-2053}
      UNIFIEDPROXY_USERNAME: ${UNIFIEDPROXY_USERNAME:-admin}
      UNIFIEDPROXY_PASSWORD: ${UNIFIEDPROXY_PASSWORD:-}
      UNIFIEDPROXY_PATH: ${UNIFIEDPROXY_PATH:-}

    volumes:
      - unifiedproxy-data:/opt/unifiedproxy/data
      - unifiedproxy-core:/opt/unifiedproxy/core

    # TUN inbounds need these two settings. Leave them commented when TUN is
    # not used, since ordinary proxy inbounds and outbounds do not need them.
    # cap_add:
    #   - NET_ADMIN
    # devices:
    #   - /dev/net/tun:/dev/net/tun

volumes:
  unifiedproxy-data:
  unifiedproxy-core:
